<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="inbound_booking">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>inbound_booking</title>
  <link rel="manifest" href="manifest.json">

  <!-- Prevent browsers and CDNs from caching this file -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
</head>
<body>
  <script>
    // Fetch the service worker script directly from the network (bypassing the SW cache,
    // because flutter_service_worker.js is not in the SW's RESOURCES manifest).
    // Extract the embedded build ID and compare it to the one stored in sessionStorage.
    // On a mismatch: unregister all service workers, wipe all caches, reload once.
    // sessionStorage is tab-scoped so the reload cannot loop.
    (async function () {
      try {
        var resp = await fetch('/flutter_service_worker.js', { cache: 'no-store' });
        var text = await resp.text();
        var match = text.match(/serviceWorkerVersion\s*=\s*"([^"]+)"/);
        var remoteVersion = match ? match[1] : null;
        var localVersion = sessionStorage.getItem('sw_build_id');

        if (remoteVersion && localVersion && localVersion !== remoteVersion) {
          sessionStorage.setItem('sw_build_id', remoteVersion);
          if ('serviceWorker' in navigator) {
            var regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(function (r) { return r.unregister(); }));
          }
          if (window.caches) {
            var keys = await caches.keys();
            await Promise.all(keys.map(function (k) { return caches.delete(k); }));
          }
          window.location.reload();
          return;
        }
        if (remoteVersion) sessionStorage.setItem('sw_build_id', remoteVersion);
      } catch (_) {
        // Offline or network error — proceed with cached assets
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
